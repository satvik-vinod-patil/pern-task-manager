name: PERN Task Manager Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: secrets-scan
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          tar --exclude='.git' --exclude='node_modules' \
            -czf app.tar.gz backend frontend deploy
          scp -i deploy_key -o StrictHostKeyChecking=accept-new \
            app.tar.gz "$EC2_USER@$EC2_HOST:/tmp/taskmanager.tar.gz"
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p /opt/taskmanager/staging && tar -xzf /tmp/taskmanager.tar.gz -C /opt/taskmanager/staging'
          rm -f deploy_key app.tar.gz

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Production deployment pending configuration
        run: echo "Configure production deployment after staging is verified."
