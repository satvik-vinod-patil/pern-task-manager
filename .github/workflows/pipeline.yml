name: PERN Task Manager Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: secrets-scan
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Staging deployment placeholder
        run: |
          echo "Gitleaks passed."
          echo "Staging deployment will be configured next."
          echo "No AWS resources have been contacted."

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Production deployment placeholder
        run: |
          echo "Production approval and deployment will be configured next."
          echo "No production resources have been contacted."
